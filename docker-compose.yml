version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agriculture-qr-db
    environment:
      - POSTGRES_DB=agriculture_qr
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agriculture-qr-app
    working_dir: /app/backend  # 关键：设置工作目录
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings  # 关键：设置 settings 模块
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agriculture_qr
      - DEBUG=1
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/backend/static
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 config.wsgi:application
      "

volumes:
  postgres_data:
  static_volume: