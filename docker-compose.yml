services:
  db:
    image: postgres:15-alpine
    container_name: agriculture-qr-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-agriculture_qr}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-agriculture_qr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agriculture-qr-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
